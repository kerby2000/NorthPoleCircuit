; PlatformIO probe project for the CH592X-EVT-R1-LinkE development board.
;
; This is intentionally separate from the active North Pole firmware, which
; remains the MounRiver/WCH EVT project under Firmware/northpole_ch592_bringup/.

[platformio]
default_envs = ch592x_build_only

[env]
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git
board = genericCH592X
framework = noneos-sdk
monitor_speed = 115200
extra_scripts = post:scripts/pio_isp_upload_hex.py

[env:ch592x_build_only]
upload_command = powershell -NoProfile -Command "Write-Error 'ch592x_build_only does not upload. Choose a documented upload environment.'; exit 1"

[env:ch592x_isp_mounriver_hex]
upload_protocol = isp
custom_wchisp_hex_path = ../mounriver_ch592_led_probe/obj/mounriver_ch592_led_probe.hex

[env:ch592x_wlink_download_mode]
upload_protocol = wlink
custom_wlink_download_upload = yes
custom_wlink_chip = CH59X
custom_wlink_speed = low
custom_wlink_erase = yes

[env:ch592x_wlink_mounriver_hex_download_mode]
upload_protocol = wlink
custom_wlink_download_upload = yes
custom_wlink_chip = CH59X
custom_wlink_speed = low
custom_wlink_erase = yes
custom_wlink_image = ../mounriver_ch592_led_probe/obj/mounriver_ch592_led_probe.hex
